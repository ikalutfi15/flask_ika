<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Diabetes - Ika</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .login {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            width: 350px;
            text-align: center;
        }
        .login h1 {
            margin-bottom: 20px;
            color: #333;
            font-size: 24px;
        }
        /* Mengatur style input dan select dropdown agar seragam */
        .login input, .login select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Arial', sans-serif;
            background-color: #fff;
        }
        .login button {
            width: 100%;
            padding: 12px;
            background: #9b59b6;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .login button:hover {
            background: #8e44ad;
        }
        .result {
            margin-top: 20px;
            font-weight: bold;
            color: #2c3e50;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="login">
        <h1>Diabetes Prediction</h1>
        
        <form action="/predict" method="post">
            <!-- Dropdown Pilihan Model -->
            <select name="model_choice" id="model_choice" required="required">
                <option value="" disabled selected hidden>Pilih Model</option>
                <option value="knn">K-Nearest Neighbors (KNN)</option>
                <option value="dt">Decision Tree</option>
                <option value="rf">Random Forest</option>
            </select>

            <!-- Input Fitur Medis -->
            <input type="number" step="any" name="Pregnancies" placeholder="Pregnancies" required="required">
            <input type="number" step="any" name="Glucose" placeholder="Glucose" required="required">
            <input type="number" step="any" name="BloodPressure" placeholder="BloodPressure" required="required">
            <input type="number" step="any" name="SkinThickness" placeholder="SkinThickness" required="required">
            <input type="number" step="any" name="Insulin" placeholder="Insulin" required="required">
            <input type="number" step="any" name="BMI" placeholder="BMI (Contoh: 26.6)" required="required">
            <input type="number" step="any" name="DiabetesPedigreeFunction" placeholder="Diabetes Pedigree Function" required="required">
            <input type="number" step="any" name="Age" placeholder="Age" required="required">
            
            <button type="submit">Predict</button>
        </form>

        <div class="result">
            {{ prediction_text }}
        </div>
    </div>

</body>
</html>
